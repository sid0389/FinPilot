# One command for the whole stack:  docker compose up --build
# App: http://localhost:5173   API: :5000   ML service: :8000
services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
  backend:
    build: ./backend
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/finpilot
      JWT_SECRET: ${JWT_SECRET:-change_me_to_a_long_random_string}
      CLIENT_URL: http://localhost:5173
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["5000:5000"]
    depends_on: [mongo]
  ml:
    build: ./ml
    environment:
      ALLOWED_ORIGINS: http://localhost:5173
      FORECAST_LOG: /app/logs/forecast_log.csv
    volumes: [ml_logs:/app/logs]
    ports: ["8000:8000"]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend, ml]
volumes:
  mongo_data:
  ml_logs:
